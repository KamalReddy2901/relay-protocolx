name: Check
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - run: npm install --global npm@10.9.9
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
